[project]
name = "cgjrkit"
version = "0.1.0"
description = "Deterministic data connectors, methods and charts for replicating exhibits in growth and jobs reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "altair>=5.3",
    "vl-convert-python>=1.5",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
cgjrkit-mcp = "cgjrkit.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgjrkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real external APIs; needs the API domains allowlisted (run with CGJRKIT_LIVE=1 pytest -m live)",
]
addopts = "-m 'not live'"
