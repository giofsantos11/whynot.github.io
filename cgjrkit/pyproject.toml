[project]
name = "cgjrkit"
version = "0.1.0"
description = "Deterministic data connectors, methods and charts for replicating exhibits in growth and jobs reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "xlrd>=2.0",            # Bruegel REER workbook is legacy .xls (pandas engine="xlrd")
    "py7zr>=1.0",           # UNCTADstat bulk files are 7z archives (LGPL-2.1-or-later; imported lazily)
    "altair>=5.5",          # charts.render uses the alt.theme API added in Altair 5.5
    "vl-convert-python>=1.5",
    "mcp>=2.3,<3",          # mcp_server uses the mcp 2.x MCPServer API (FastMCP was removed in 2.0)
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
cgjrkit-mcp = "cgjrkit.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgjrkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real external APIs; needs the API domains allowlisted (run with CGJRKIT_LIVE=1 pytest -m live)",
]
addopts = "-m 'not live'"
