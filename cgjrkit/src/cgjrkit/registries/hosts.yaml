# Hosts that cgjrkit calls or plans to call: the single source for the network
# allowlist (docs/ALLOWLIST.md, cloud environment, Bank IT review) and for
# per-host rate-limit defaults. Every connector's `domains` must appear here
# (tests/test_registries.py enforces it).
#
# Fields
#   connectors   connector modules (cgjrkit.connectors.<name>) that call the host;
#                [] for hosts reserved for planned tools
#   purpose      what the host serves
#   status       verified   = host and URL forms confirmed from official docs or the
#                             provider's / a maintained client's source code
#                unverified = taken from the plan or third-party material; confirm
#                             with a live test once the host is allowlisted
#   dev_network  blocked | untested  (state in the build environment, Oct 2026;
#                inventory/build-plan.md section 5.2; nothing here was reachable)
#   auth         none | key:<ENV VAR> | token:<ENV VAR>
#   rate_limit   {requests, per_seconds, basis, note}
#                basis: published            = provider's own figure
#                       client_practice      = what maintained clients do
#                       conservative_default = limit unknown (U); cautious default
#   phase        mvp | next | later | excluded (inventory/build-plan.md section 3)
#   evidence     where the facts above come from
schema_version: 1

defaults:
  rate_limit: {requests: 30, per_seconds: 60, basis: conservative_default,
               note: "Used for any host whose limit is unknown (plan: cautious defaults where the limit is U)"}

