    licence_status: V
    commercial_use: "no"
    commercial_use_status: V
    third_party_flags: true
    caveat: block
    citation: "Federal Reserve Bank of St. Louis, FRED"
    notes: "Excluded: use the primary sources instead."
    evidence: ["https://fred.stlouisfed.org/docs/api/terms_of_use.html"]

