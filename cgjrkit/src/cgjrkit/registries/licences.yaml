    commercial_use: yes_with_attribution
    commercial_use_status: I
    third_party_flags: false
    caveat: info
    citation: "Bruegel REER database (Darvas 2012, 2021)"
    notes: "Terms specific to the REER file are unverified (U); the file is replaced in place, so snapshot it."
    evidence: ["https://www.bruegel.org/publications/datasets/real-effective-exchange-rates-for-178-countries-a-new-database", "docs/apis/bruegel.md"]
  ted:
    name: "Conference Board Total Economy Database"
