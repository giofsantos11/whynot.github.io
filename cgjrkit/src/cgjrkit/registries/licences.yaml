# Licence register: one entry per source (keys match the connectors' `source`
# attribute where a connector exists). Input for the "licensed data" caveat.
#
# Status letters follow inventory/build-plan.md section 4:
#   V = verified on an official or primary page
#   I = inferred (e.g. commercial use follows from CC BY)
#   U = unknown; ask the provider before commercial delivery
#
# Fields
#   name                   human-readable source name
#   licence                licence or terms as stated by the provider
#   licence_status         V | I | U
#   commercial_use         yes | yes_with_attribution | restricted | no | unknown
#   commercial_use_status  V | I | U
#   third_party_flags      true when some series carry third-party terms (check per series)
#   caveat                 suggested severity of the licence caveat: none | info | warn | block
#   citation               default source line
#   notes                  what to do
#   evidence               URLs or docs
schema_version: 1

sources:
  # --- macro, labour, population (plan 4.1) -----------------------------------
  worldbank:
    name: "World Bank Indicators API v2 (WDI, WGI, GFDD, WDI archives)"
    licence: "CC BY 4.0 (World Bank terms of use for datasets)"
    licence_status: V
    commercial_use: yes_with_attribution
    commercial_use_status: I
    third_party_flags: true
    caveat: info
    citation: "World Bank, World Development Indicators"
    notes: "Some indicators come from third parties with their own terms, flagged in indicator metadata (V). Attribute the World Bank and the dataset; do not imply endorsement."
    evidence: ["https://www.worldbank.org/en/about/legal/terms-of-use-for-datasets", "docs/apis/worldbank.md"]
  data360:
    name: "World Bank Data360 API"
    licence: "CC BY 4.0 (OpenAPI info.license); per-indicator licence in metadata"
    licence_status: V
    commercial_use: yes_with_attribution
    commercial_use_status: I
    third_party_flags: true
    caveat: info
    citation: "World Bank Data360"
    notes: "The connector reads each indicator's license[] and warns for anything that is not CC BY."
    evidence: ["docs/apis/data360.md"]
  imf:
    name: "IMF SDMX API and DataMapper (WEO, BOP, ex-IFS)"
    licence: "IMF Copyright and Usage terms (effective 11 Oct 2024)"
    licence_status: V
    commercial_use: unknown
    commercial_use_status: U
    third_party_flags: false
    caveat: warn
    citation: "IMF, World Economic Outlook database"
    notes: "Systematic downloading or substantial reuse needs written permission (V). Ask copyright@imf.org before bulk caching or commercial delivery."
    evidence: ["https://www.imf.org/en/About/copyright-and-terms", "docs/apis/imf.md"]
  ilostat:
    name: "ILOSTAT (bulk service and SDMX)"
    licence: "CC BY 4.0 for databases and datasets published from 3 May 2023 (ILO open-access policy)"
    licence_status: V
    commercial_use: yes_with_attribution
    commercial_use_status: I
    third_party_flags: false
    caveat: warn
    citation: "ILOSTAT, International Labour Organization (ILO)"
    notes: "The Rilostat README still says non-commercial; confirm with the ILO before commercial delivery."
    evidence: ["https://www.ilo.org/node/9321", "docs/apis/ilostat.md"]
  pwt:
    name: "Penn World Table 10.01 / 11.0"
    licence: "CC BY 4.0"
    licence_status: V
    commercial_use: yes_with_attribution
    commercial_use_status: V
    third_party_flags: false
    caveat: none
    citation: "Penn World Table (Feenstra, Inklaar and Timmer 2015)"
    notes: "Cite Feenstra, Inklaar and Timmer (2015), American Economic Review 105(10). PWT 11.0 uses ICP 2021 PPPs, 10.01 uses 2017 PPPs."
    evidence: ["https://www.rug.nl/ggdc/blog/penn-world-table-version-11-0-is-published", "docs/apis/pwt.md"]
  wpp:
    name: "UN World Population Prospects 2024"
    licence: "CC BY 3.0 IGO (download catalogue footer; publications)"
    licence_status: V
    commercial_use: yes_with_attribution
    commercial_use_status: I
    third_party_flags: false
    caveat: info
    citation: "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024, Online Edition"
    notes: "Terms of the data portal API pages are not verified (U). Do not imply UN endorsement."
    evidence: ["docs/apis/wpp.md"]
  unido:
    name: "UNIDO INDSTAT"
    licence: "CC BY 4.0 (since 2022)"
    licence_status: V
    commercial_use: yes_with_attribution
    commercial_use_status: I
    third_party_flags: false
    caveat: none
    citation: "UNIDO, INDSTAT"
    notes: "Use UNIDO's own copy; mirrors such as ERF's are non-commercial."
    evidence: ["https://unido.org/node/250"]
  etd:
    name: "GGDC/UNU-WIDER Economic Transformation Database"
    licence: "CC BY 4.0"
    licence_status: V
    commercial_use: yes_with_attribution
    commercial_use_status: I
    third_party_flags: false
    caveat: none
    citation: "GGDC/UNU-WIDER Economic Transformation Database (Kruse et al. 2022)"
    notes: "Data to 2018; country coverage of MKD, MAR, PHL, IDN not checked (U)."
